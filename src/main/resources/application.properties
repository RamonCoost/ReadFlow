spring.application.name=ReadFlow

# Spring Config properties
spring.config.import=optional:file:.env[.properties]
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
google.books.api=${KEY_API}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# PostgresSQL Data Configuration
spring.datasource.url=jdbc:postgresql://${KEY_POSTGRES_HOST}:${KEY_POSTGRES_PORT}/${KEY_POSTGRES_DB}?sslmode=${KEY_POSTGRES_SSLMODE:disable}
spring.datasource.username=${KEY_POSTGRES_USER}
spring.datasource.password=${KEY_POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Configuration (HikariCP)

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000


